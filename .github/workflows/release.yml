# Release pipeline: builds, signs (when secrets are present) and tests the installers on clean
# runners, then creates a DRAFT GitHub Release with every artifact and SHA256SUMS.txt. Nothing is
# published until you publish the draft. Modelled on the PdfCraft release workflow
# (https://github.com/richfrem/pdfcraft); see docs/releasing.md.
#
# Start it by pushing to the `release` branch, or by hand (Actions > Release > Run workflow). The
# optional `version` input overrides app/binder_app/__init__.py for a test run. On any branch other
# than `release` the signing jobs are refused by the `release` environment's branch rule (when you
# set one up) and no draft is created, so a manual run elsewhere is a dry run.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: __version__)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CBB_VERSION: ${{ inputs.version }}

jobs:
  macos:
    runs-on: macos-latest
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Package, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: dist/release/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install the pinned WiX toolchain
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install --tool-path $tools wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          $tools >> $env:GITHUB_PATH
      - name: Package and sign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: ./packaging/windows/package.ps1
      - name: Install, self-test, upgrade and uninstall
        shell: pwsh
        run: ./packaging/windows/test-install.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installers
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error

  draft-release:
    needs: [macos, windows]
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write # only this job creates the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${CBB_VERSION:-$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/binder_app/__init__.py | head -n 1)}"
          tag="v$version"
          mkdir release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$tag" --json isDraft --jq .isDraft >/tmp/is_draft 2>/dev/null; then
            if [ "$(cat /tmp/is_draft)" != "true" ]; then
              echo "::error::Release $tag is already published; bump the version first."
              exit 1
            fi
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --draft --target "$GITHUB_SHA" \
              --title "Court binder builder $tag" --generate-notes "${prerelease[@]}"
          fi
