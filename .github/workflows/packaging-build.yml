# Builds both installers (unsigned) on clean runners, self-tests the packaged apps, and for Windows
# installs the MSI, self-tests the installed app, reinstalls over it and uninstalls. This is the
# clean-machine test for packaging/. Releases are built by release.yml.
name: Packaging build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "app/**"
      - ".apm/skills/managing-court-binders/scripts/**"
      - ".apm/skills/managing-court-binders/references/cso_links.json"
      - ".github/workflows/packaging-build.yml"

permissions:
  contents: read

concurrency:
  group: packaging-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Package (unsigned, ad-hoc)
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: dist/release/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install the pinned WiX toolchain
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install --tool-path $tools wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          $tools >> $env:GITHUB_PATH
      - name: Package (unsigned)
        shell: pwsh
        run: ./packaging/windows/package.ps1
      - name: Install, self-test, upgrade and uninstall
        shell: pwsh
        run: ./packaging/windows/test-install.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installers
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error
